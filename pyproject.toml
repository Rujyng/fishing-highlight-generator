[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishing-highlight-generator"
version = "0.1.0"
description = "Fishing video highlight generation pipeline."
requires-python = ">=3.11"
dependencies = [
  "boto3",
  "google-genai",
  "openai-whisper",
  "twelvelabs",
]

[project.scripts]
fishing-highlights = "fishing_highlights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
